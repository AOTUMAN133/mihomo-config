# ============================================================
# Mihomo (Clash.Meta) 多机场订阅配置模板
# ------------------------------------------------------------
# 结构: 4 个机场订阅(proxy-providers) -> 地区组自动合并四家节点 -> 服务组按需选择
# 用法: 1) 把 REPLACE_ME_A ~ REPLACE_ME_D 换成机场订阅链接
#       2) 校验: mihomo -t -f config.yaml  (或 bash scripts/check.sh)
#       3) 导入客户端(Clash Verge / OpenClash / mihomo 内核 / Android)
# 规则: Aethersailor/Custom_OpenClash_Rules + GEOSITE/GEOIP(v2ray-rules-dat)
# 注意: 本文件不含真实订阅凭证(公开仓库不落凭证)
# ============================================================
port: 7890
socks-port: 7891
mixed-port: 7893
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
tcp-concurrent: true
unified-delay: true
proxy-providers:
  "机场一":
    type: http
    url: "REPLACE_ME_A"            # ← 机场订阅链接(或用 scripts/render.py 从 airports.yaml 注入)
    interval: 3600                     # 订阅更新间隔(秒); 机场限速严可调大到 7200
    path: ./proxy_provider/A.yaml
    proxy: DIRECT                      # 拉订阅时不走代理
    # 在该机场这一层先滤掉公告/流量/到期等非节点条目, 各策略组就不必重复配
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true                       # 按需测速省电; 想常驻测速改成 false
    override:
      udp: true
      # additional-prefix: "[A] "  # 打开后节点名带 [A] 前缀, 多机场时一眼看清来源
  "机场二":
    type: http
    url: "REPLACE_ME_B"            # ← 机场订阅链接(或用 scripts/render.py 从 airports.yaml 注入)
    interval: 3600                     # 订阅更新间隔(秒); 机场限速严可调大到 7200
    path: ./proxy_provider/B.yaml
    proxy: DIRECT                      # 拉订阅时不走代理
    # 在该机场这一层先滤掉公告/流量/到期等非节点条目, 各策略组就不必重复配
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true                       # 按需测速省电; 想常驻测速改成 false
    override:
      udp: true
      # additional-prefix: "[B] "  # 打开后节点名带 [A] 前缀, 多机场时一眼看清来源
  "机场三":
    type: http
    url: "REPLACE_ME_C"            # ← 机场订阅链接(或用 scripts/render.py 从 airports.yaml 注入)
    interval: 3600                     # 订阅更新间隔(秒); 机场限速严可调大到 7200
    path: ./proxy_provider/C.yaml
    proxy: DIRECT                      # 拉订阅时不走代理
    # 在该机场这一层先滤掉公告/流量/到期等非节点条目, 各策略组就不必重复配
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true                       # 按需测速省电; 想常驻测速改成 false
    override:
      udp: true
      # additional-prefix: "[C] "  # 打开后节点名带 [A] 前缀, 多机场时一眼看清来源
  "机场四":
    type: http
    url: "REPLACE_ME_D"            # ← 机场订阅链接(或用 scripts/render.py 从 airports.yaml 注入)
    interval: 3600                     # 订阅更新间隔(秒); 机场限速严可调大到 7200
    path: ./proxy_provider/D.yaml
    proxy: DIRECT                      # 拉订阅时不走代理
    # 在该机场这一层先滤掉公告/流量/到期等非节点条目, 各策略组就不必重复配
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true                       # 按需测速省电; 想常驻测速改成 false
    override:
      udp: true
      # additional-prefix: "[D] "  # 打开后节点名带 [A] 前缀, 多机场时一眼看清来源

  # ---- 可选: 自建 VPS 也当成一个 provider(取消注释并填 url) ----
  # "自建节点":
  #   type: http
  #   url: "REPLACE_ME_SELF"
  #   interval: 3600
  #   path: ./proxy_provider/self.yaml
  #   proxy: DIRECT
  #   override:
  #     additional-prefix: "🏴‍☠️ "

  # ---- 可选: 把 Sub-Store 之类的聚合订阅再串成第 5 个源 ----
  # "聚合源":
  #   type: http
  #   url: "http://192.168.1.133:3000/download/FreeAll?target=ClashMeta&ignoreFailedRemoteSub=true"
  #   interval: 1800
