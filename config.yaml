geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  asn: https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: system
  dns-hijack:
  - 0.0.0.0:53
  auto-detect-interface: false
  auto-route: false
  auto-redirect: false
  strict-route: false
  endpoint-independent-nat: true
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - +.netflix.com
  - +.nflxvideo.net
  - +.amazonaws.com
  - +.media.dssott.com
  skip-domain:
  - +.apple.com
  - Mijia Cloud
  - dlg.io.mi.com
  - +.oray.com
  - +.sunlogin.net
  - +.push.apple.com
  parse-pure-ip: true
  force-dns-mapping: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  default-nameserver:
  - 114.114.114.114
  - tls://223.5.5.5:853
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - localhost.ptlogin2.qq.com
  - geosite:cn
  fake-ip-filter-mode: blacklist
  respect-rules: false
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
proxy-groups:
- name: 🚀 手动选择
  type: select
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - ♻️ 自动选择
  - 🔯 故障转移
  - ⚖️ 负载均衡
  - 🇭🇰 香港节点
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇼🇸 台湾节点
  - 🇰🇷 韩国节点
  - 🇨🇦 加拿大节点
  - 🇬🇧 英国节点
  - 🇫🇷 法国节点
  - 🇩🇪 德国节点
  - 🇳🇱 荷兰节点
  - 🇹🇷 土耳其节点
  - 🌐 其他地区
  filter: ^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$
  use:
  - 机场一
  - 机场二
  - 机场三
  - 机场四
- name: ♻️ 自动选择
  type: fallback
  filter: ^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$
  url: http://www.gstatic.com/generate_204
  interval: 180
  use:
  - 机场一
  - 机场二
  - 机场三
  - 机场四
  lazy: true

- name: 🔯 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  lazy: true
  use:
  - 机场一
  - 机场二
  - 机场三
  - 机场四

- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  url: http://www.gstatic.com/generate_204
  interval: 300
  lazy: true
  use:
  - 机场一
  - 机场二
  - 机场三
  - 机场四

- name: 1️⃣ 机场一
